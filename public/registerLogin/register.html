<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/register.css" />
    <link rel="shortcut icon" href="../assets/imgs/logo.svg" type="image/x-icon" />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
    />
    <script src="../js/register.js" defer></script>
    <title>Cadastra-se | Pumpkin</title>
  </head>
  <body>
    <header class="mainHeader">
      <nav>
        <a href="/#">
          <img src="../assets/imgs/logo.svg" id="logoPumpkin" alt="Logo Abóbora" />
        </a>
        <div class="menu">
          <ul>
            <a href="/#home">Início</a>
            <a href="#howWorks">Como funciona</a>
            <a href="#dashboard">Dashboard</a>
            <a href="#aboutUs">Sobre nós</a>
          </ul>
        </div>
        <a href="login.html">
          <button class="btnGlass">Entrar</button>
        </a>
      </nav>
    </header>
    <div class="registerContent">
      <div class="cardForm">
        <form onsubmit="register()">
          <h2>Criar conta</h2>
          <div class="rowForm">
            <label for="iptFullName" class="labelForm"
              >Informe seu nome completo</label
            >
            <input
              type="text"
              id="iptFullName"
              class="inputForm"
              placeholder="Seu nome"
            />
            <span id="inputErrorName"></span>
          </div>

          <div class="rowForm">
            <label for="iptEmail" class="labelForm">Informe seu e-mail</label>
            <input
              type="text"
              id="iptEmail"
              class="inputForm"
              placeholder="example@email.com"
            />
            <span id="inputErrorEmail"></span>
          </div>

          <div class="rowForm">
            <label for="iptUsername" class="labelForm"
              >Informe seu apelido</label
            >
            <input
              type="text"
              id="iptUsername"
              class="inputForm"
              placeholder="pumpkin123"
            />
            <span id="inputErrorUsername"></span>
          </div>

          <div class="rowForm">
            <label for="iptPassword" class="labelForm">Informe senha</label>
            <input
              type="text"
              id="iptPassword"
              class="inputForm"
              placeholder="Sua senha"
              onkeyup="validatePassword()"
            />
            <span id="inputErrorPassword"></span>
          </div>

          <div class="rowForm">
            <label for="iptPasswordConfirmation" class="labelForm"
              >Confirmação de senha</label
            >
            <input
              type="text"
              id="iptPasswordConfirmation"
              class="inputForm"
              placeholder="Confirme a senha"
              onkeyup="validatePassword()"
            />
            <span id="inputErrorConfirmation"></span>
          </div>

          <button class="btnGlass">Cadastrar-se</button>
          <p class="description">
            Já tem uma conta? <a href="login.html">Login</a>
          </p>
        </form>
      </div>
    </div>
  </body>
</html>
