<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="../assets/imgs/logo.svg"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="dashboard/style.css" />
    <link rel="stylesheet" href="quizzes/style.css" />
    <script src="script.js" defer></script>
    <script src="../js/sessao.js" defer></script>
    <script src="../js/alertMessage.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <script src="dashboard/script.js" defer></script>
    <script src="quizzes/script.js" defer></script>
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css"
    />
    <title>Pumpkin</title>
  </head>
  <body onload="showQuiz()">
    <div class="userArea">
      <aside class="sideNav">
        <div class="logoContent">
          <a href="/#">
            <img
              id="logoPumpkin"
              src="../assets/imgs/logo.svg"
              alt="Logo Abóbora"
            />
          </a>
        </div>
        <div class="sideMenu">
          <div class="btnNav active" data-page="quizzes">
            <i class="ph ph-check-circle"></i>
            <button>Quizzes</button>
          </div>
          <div class="btnNav" data-page="dashboard">
            <i class="ph ph-chart-bar"></i>
            <button>Dashboard</button>
          </div>
        </div>
        <div class="sideFooter">
          <div class="perfil">
            <img src="../assets/imgs/perfil.jpeg" alt="" />
            <span id="username">@</span>
          </div>
          <div class="logout">
            <button class="" onclick="logoutSession()">
              <i class="ph ph-sign-out"></i>
              Sair
            </button>
          </div>
        </div>
      </aside>
      <div class="pages">
        <div class="page active" id="quizzes">
          <div class="quiz-container">
            <div id="quizStart" class="cardQuiz">
              <h1 id="quizTitle"></h1>
              <p id="quizDescription"></p>
              
              <div class="cardFooter">
                <button class="btnGlass" onclick="startQuiz()">Começar</button>
              </div>
            </div>
            
            <div id="quizQuestions" class="cardQuiz cardAlternatives hidden">
              <div class="cardHeader">
                <div class="headerQuestions">
                  <h2 id="numQuesiton"></h2>
                  <h2 id="currentQuestion"></h2>
                </div>
                <button class="btnGlass" onclick="closeQuestion()"><i class="ph-bold ph-x"></i></button>
              </div>
              <div id="alternatives"></div>

              <div class="cardFooter">
                <button class="btnGlass" onclick="previousQuestion()">
                  Voltar
                </button>
                <button class="btnGlass" onclick="nextQuestion()">
                  Próximo
                </button>
              </div>
            </div>

            <div id="quizResult" class="cardQuiz hidden">
              <h2>Seu resultado:</h2>
              <h3 id="namePerfil"></h3>
              <p id="descriptionPerfil"></p>
            </div>
          </div>
        </div>

        <div class="page" id="dashboard">
          <h1 class="title">Dashboard</h1>
          <div class="kpis">
            <div class="kpi">
              <span class="kpiTitle">Perfil predominante</span>
              <span class="kpiPerfil">Ousado <span>80%</span></span>
              <span class="kpiSubtitle">Maior pontuação</span>
            </div>
            <div class="kpi">
              <span class="kpiTitle">Quizzes concluídos</span>
              <span class="kpiValue">3</span>
              <span class="kpiSubtitle">Total de tentivas</span>
            </div>
            <div class="kpi">
              <span class="kpiTitle">Perfil secundário</span>
              <span class="kpiSubPerfil">Minimalista <span>72%</span></span>
              <span class="kpiSubtitle">Segunda maior pontuação</span>
            </div>
            <div class="kpi">
              <span class="kpiTitle">Participação do perfil predominante</span>
              <span class="kpiValue">32%</span>
            </div>
          </div>

          <div class="charts">
            <div class="mainChart">
              <canvas id="chartRadar"></canvas>
            </div>
            <div class="auxiliaryChart">
              <canvas id="chartDoughnut"></canvas>
            </div>
          </div>
        </div>
      </div>
      <div class="alertMessage">
        <p></p>
      </div>
    </div>
  </body>
</html>
